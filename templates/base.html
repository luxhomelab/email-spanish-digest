<!DOCTYPE html>
<html lang="en"{% block html_class %}{% endblock %}>
<head>
<!-- Google tag (gtag.js) -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CBF70VDX1D');
</script>
 <link rel="icon" href="/favicon.ico" sizes="any">
 <link rel="icon" type="image/png" href="/apple-touch-icon.png">
 <link rel="apple-touch-icon" href="/apple-touch-icon.png">
 <meta property="og:image" content="https://spanified.com/logo.jpg">
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>{% block title %}Spanified — Spain Daily{% endblock %}</title>

 {% block canonical %}{% endblock %}
 <link rel="stylesheet" href="/static/css/main.css?v={{ asset_version }}">

</head>
<body{% block body_class %}{% endblock %}>
{% include "partials/header.html" %}

 <main class="content">
{% block content %}{% endblock %}
 </main>

{% include "partials/footer.html" %}
</body>
</html>
