{# "Try the other quiz" cards on the quiz pages. Expects `other_quizzes`
   (load_quiz_cards(lang=...), English `url` run through lang_url). #}
{% for other in other_quizzes %}
   <a class="quiz-other" href="{{ lang_url(other.url) }}" aria-label="{{ t('Try the other quiz: {title}', title=other.title) }}">
    <img class="quiz-other-cover" src="{{ other.cover }}" alt="{{ other.title }}" width="1200" height="630" loading="lazy">
    <span class="quiz-other-body">
     <span class="quiz-other-kicker">{{ t("Try the other quiz") }}</span>
     <span class="quiz-other-title">{{ other.title }}</span>
     <span class="quiz-other-go">{{ t("Play now →") }}</span>
    </span>
   </a>
{% endfor %}
