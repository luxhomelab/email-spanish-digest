<figure class="ag ag-dl">
 <div class="ag-panel">
  <ol class="ag-dl-track">
   <li class="ag-dl-stage ag-c-gov"><span class="ag-dl-day">Day 0</span><span class="ag-dl-title">Council of Ministers approves it</span><span class="ag-dl-sub">no vote in parliament needed</span></li>
   <li class="ag-dl-stage ag-c-ink"><span class="ag-dl-day">Usually day 1</span><span class="ag-dl-title">Published in the BOE and in force</span><span class="ag-dl-sub">it applies to everyone straight away</span></li>
   <li class="ag-dl-stage ag-c-cortes"><span class="ag-dl-day">Within 30 days</span><span class="ag-dl-title">Congress votes yes or no</span><span class="ag-dl-sub">on the whole text, with no amendments</span></li>
  </ol>
  <div class="ag-dl-clock" aria-hidden="true"><span>in force while the 30-day clock runs</span></div>
  <div class="ag-dl-out">
   <span class="ag-dl-yes"><b>Validated</b> (<i lang="es">convalidado</i>): it stays in force. Congress can also choose to process it as a bill, which opens it to amendments.</span>
   <span class="ag-dl-no"><b>Rejected</b> (<i lang="es">derogado</i>): it stops applying from that day.</span>
  </div>
  <div class="ag-dl-alt">
   <span class="ag-dl-alt-q">Parliament dissolved?</span>
   <span>The vote passes to the <b>Diputación Permanente</b>, a smaller standing committee with seats shared out by group size. Every other bill in progress lapses.</span>
  </div>
 </div>
 <figcaption>A decree-law is law first and voted on afterwards. Congress, or its standing committee, can only take it or leave it as a whole.</figcaption>
</figure>
