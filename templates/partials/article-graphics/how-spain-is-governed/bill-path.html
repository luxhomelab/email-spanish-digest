<figure class="ag ag-bill">
 <div class="ag-panel">
  <ol class="ag-steps ag-bill-steps">
   <li class="ag-step ag-c-cortes"><span class="ag-step-n">1</span><span class="ag-step-body"><span class="ag-step-who">Congress</span><span class="ag-step-what">debates and passes the bill</span></span></li>

 </div>
