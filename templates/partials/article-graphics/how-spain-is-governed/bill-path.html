<figure class="ag ag-law">
 <div class="ag-panel ag-law-panel">
  <div class="ag-law-start">
   <span class="ag-law-q">Who can start a law</span>
   <ul class="ag-law-src">
    <li class="ag-c-gov"><b>Government</b><span>a <i lang="es">proyecto de ley</i></span></li>
    <li class="ag-c-cortes"><b>Congress</b><span>a group or 15 deputies</span></li>
    <li class="ag-c-senate"><b>Senate</b><span>a group or 25 senators</span></li>
    <li class="ag-c-ink"><b>Regional parliaments</b><span>send a bill to Congress</span></li>
    <li class="ag-c-people"><b>Citizens</b><span>500,000 signatures</span></li>
   </ul>
   <span class="ag-law-funnel">Every bill starts its journey in Congress</span>
  </div>
  <ol class="ag-law-path">
   <li class="ag-law-stop ag-c-cortes">
    <span class="ag-law-n">1</span>
    <span class="ag-law-body"><span class="ag-law-who">Congress</span><span class="ag-law-what">debates the bill, amends it and votes. Organic laws need 176 votes in a final vote.</span></span>
    <span class="ag-law-clock">Senate has 2 months, or 20 days if urgent</span>
   </li>
   <li class="ag-law-stop ag-c-senate">
    <span class="ag-law-n">2</span>
    <span class="ag-law-body"><span class="ag-law-who">Senate</span><span class="ag-law-what">passes it, amends it by simple majority or vetoes it by absolute majority</span></span>
   </li>
   <li class="ag-law-stop ag-c-cortes">
    <span class="ag-law-n">3</span>
    <span class="ag-law-body"><span class="ag-law-who">Congress again</span><span class="ag-law-what">votes on each amendment by simple majority; overturns a veto with 176 votes now, or a simple majority after two months (organic laws: always 176)</span></span>
    <span class="ag-law-clock">The King has 15 days to sign</span>
   </li>
   <li class="ag-law-stop ag-c-crown">
    <span class="ag-law-n">4</span>
    <span class="ag-law-body"><span class="ag-law-who">The King</span><span class="ag-law-what">signs it (<i lang="es">sanciona</i>), promulgates it and orders it published</span></span>
   </li>
   <li class="ag-law-stop ag-law-boe ag-c-ink">
    <span class="ag-law-n">5</span>
    <span class="ag-law-body"><span class="ag-law-who">BOE</span><span class="ag-law-what">published in the official gazette; in force 20 days later unless the law sets its own date</span></span>
   </li>
  </ol>
 </div>
 <figcaption>The road of a bill. The Senate can slow a law down or send it back with changes, but it can't block it: Congress has the last word.</figcaption>
</figure>
