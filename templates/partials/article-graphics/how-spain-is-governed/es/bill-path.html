<figure class="ag ag-law">
 <div class="ag-panel ag-law-panel">
  <div class="ag-law-start">
   <span class="ag-law-q">Quién puede proponer una ley</span>
   <ul class="ag-law-src">
    <li class="ag-c-gov"><b>Gobierno</b><span>un <i lang="es">proyecto de ley</i></span></li>
    <li class="ag-c-cortes"><b>Congreso</b><span>un grupo o 15 diputados</span></li>
    <li class="ag-c-senate"><b>Senado</b><span>un grupo o 25 senadores</span></li>
    <li class="ag-c-ink"><b>Parlamentos autonómicos</b><span>envían una proposición al Congreso</span></li>
    <li class="ag-c-people"><b>Ciudadanía</b><span>500.000 firmas</span></li>
   </ul>
   <span class="ag-law-funnel">Toda ley empieza su recorrido en el Congreso</span>
  </div>
  <ol class="ag-law-path">
   <li class="ag-law-stop ag-c-cortes">
    <span class="ag-law-n">1</span>
    <span class="ag-law-body"><span class="ag-law-who">Congreso</span><span class="ag-law-what">debate el texto, lo enmienda y lo vota. Las leyes orgánicas necesitan 176 votos en una votación final.</span></span>
    <span class="ag-law-clock">El Senado tiene 2 meses, o 20 días si es urgente</span>
   </li>
   <li class="ag-law-stop ag-c-senate">
    <span class="ag-law-n">2</span>
    <span class="ag-law-body"><span class="ag-law-who">Senado</span><span class="ag-law-what">lo aprueba sin cambios (pasa directamente al Rey), lo enmienda por mayoría simple o lo veta por mayoría absoluta</span></span>
   </li>
   <li class="ag-law-stop ag-c-cortes">
    <span class="ag-law-n">3</span>
    <span class="ag-law-body"><span class="ag-law-who">De nuevo el Congreso</span><span class="ag-law-what">solo si el Senado lo enmendó o lo vetó. Vota cada enmienda por mayoría simple; levanta el veto con 176 votos de inmediato o por mayoría simple a los dos meses (leyes orgánicas: siempre 176)</span></span>
    <span class="ag-law-clock">El Rey tiene 15 días para firmar</span>
   </li>
   <li class="ag-law-stop ag-c-crown">
    <span class="ag-law-n">4</span>
    <span class="ag-law-body"><span class="ag-law-who">El Rey</span><span class="ag-law-what">la firma (<i lang="es">sanciona</i>), la promulga y ordena su publicación</span></span>
   </li>
   <li class="ag-law-stop ag-law-boe ag-c-ink">
    <span class="ag-law-n">5</span>
    <span class="ag-law-body"><span class="ag-law-who">BOE</span><span class="ag-law-what">se publica en el Boletín Oficial del Estado; entra en vigor a los 20 días, salvo que la ley fije otra fecha</span></span>
   </li>
  </ol>
 </div>
 <figcaption>El camino de una ley. El Senado puede frenarla o devolverla con cambios, pero no bloquearla: la última palabra la tiene el Congreso.</figcaption>
</figure>
