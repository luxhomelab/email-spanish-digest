<figure class="ag ag-dl">
 <div class="ag-panel">
  <ol class="ag-dl-track">
   <li class="ag-dl-stage ag-c-gov"><span class="ag-dl-day">Día 0</span><span class="ag-dl-title">El Consejo de Ministros lo aprueba</span><span class="ag-dl-sub">sin votación en las Cortes</span></li>
   <li class="ag-dl-stage ag-c-ink"><span class="ag-dl-day">Normalmente, día 1</span><span class="ag-dl-title">Se publica en el BOE y entra en vigor</span><span class="ag-dl-sub">se aplica a todos desde ese momento</span></li>
   <li class="ag-dl-stage ag-c-cortes"><span class="ag-dl-day">En un plazo de 30 días</span><span class="ag-dl-title">El Congreso vota sí o no</span><span class="ag-dl-sub">sobre el texto completo, sin enmiendas</span></li>
  </ol>
  <div class="ag-dl-clock" aria-hidden="true"><span>en vigor mientras corre el plazo de 30 días</span></div>
  <div class="ag-dl-out">
   <span class="ag-dl-yes"><b>Convalidado</b> (<i lang="es">sigue en vigor</i>): se mantiene. El Congreso también puede tramitarlo como proyecto de ley, lo que permite enmendarlo.</span>
   <span class="ag-dl-no"><b>Derogado</b> (<i lang="es">deja de aplicarse</i>): pierde efecto desde ese día.</span>
  </div>
  <div class="ag-dl-alt">
   <span class="ag-dl-alt-q">¿Cortes disueltas?</span>
   <span>La votación pasa a la <b>Diputación Permanente</b>, un órgano más pequeño con los puestos repartidos según el tamaño de cada grupo. Todos los demás proyectos en trámite decaen.</span>
  </div>
 </div>
 <figcaption>Un decreto-ley es ley primero y se vota después. El Congreso, o su Diputación Permanente, solo puede aceptarlo o rechazarlo entero.</figcaption>
