<figure class="ag ag-censure">
 <div class="ag-panel">
  <div class="ag-censure-swap" role="img" aria-label="A motion of censure removes the prime minister and installs a named replacement in the same vote, which needs 176 of 350 votes in Congress">
   <span class="ag-censure-pm ag-censure-out"><span class="ag-censure-badge">PM</span><span class="ag-censure-role">Sitting prime minister</span><span class="ag-censure-fate">out</span></span>
   <span class="ag-censure-vote">
    <span class="ag-censure-votelabel">one vote in Congress</span>
    <span class="ag-censure-bar"><span class="ag-censure-fill"></span><span class="ag-censure-mark"></span></span>
    <span class="ag-censure-votenum"><b>176</b> of 350 needed</span>
   </span>
   <span class="ag-censure-pm ag-censure-in"><span class="ag-censure-badge">PM</span><span class="ag-censure-role">Named replacement</span><span class="ag-censure-fate">in</span></span>
  </div>
  <div class="ag-censure-rule">
   <span class="ag-censure-x" aria-hidden="true"></span>
   <span>Voting the Government out without agreeing on who comes next is not an option. That is what <i lang="es">constructiva</i> means, and it is how the government changed in 2018.</span>
  </div>
 </div>
 <figcaption>A Spanish motion of censure is a swap, not a dismissal: the same 176 votes that remove the prime minister install the successor.</figcaption>
</figure>
