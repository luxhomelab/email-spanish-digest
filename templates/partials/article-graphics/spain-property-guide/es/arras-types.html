<figure class="ag ag-arras">
 <div class="ag-panel">
  <div class="ag-arras-grid">
   <div class="ag-arras-kind ag-arras-main">
    <span class="ag-arras-name" lang="es">Penitenciales</span>
    <span class="ag-arras-tag">las más habituales; exigen mencionar expresamente el art. 1454</span>
    <span class="ag-arras-q">¿Puedes echarte atrás?</span>
    <span class="ag-arras-a ag-arras-yes">Sí, cualquiera de las partes, a costa de la señal</span>
    <span class="ag-arras-q">Si se echa atrás el comprador</span>
    <span class="ag-arras-out"><span class="ag-arras-coins" aria-hidden="true"><i class="ag-arras-lost"></i></span>pierde la señal</span>
    <span class="ag-arras-q">Si se echa atrás el vendedor</span>
    <span class="ag-arras-out"><span class="ag-arras-coins" aria-hidden="true"><i></i><i></i></span>devuelve la señal duplicada</span>
   </div>
   <div class="ag-arras-kind">
    <span class="ag-arras-name" lang="es">Confirmatorias</span>
    <span class="ag-arras-tag">así suelen interpretar los tribunales un contrato que no menciona el art. 1454</span>
    <span class="ag-arras-q">¿Puedes echarte atrás?</span>
    <span class="ag-arras-a ag-arras-no">No, la señal es solo una parte del precio</span>
    <span class="ag-arras-q">Si una de las partes no cumple</span>
    <span class="ag-arras-out ag-arras-court">la otra puede ir a los tribunales para exigir el contrato o reclamar daños</span>
   </div>
   <div class="ag-arras-kind">
    <span class="ag-arras-name" lang="es">Penales</span>
    <span class="ag-arras-tag">la señal funciona como una penalización</span>
    <span class="ag-arras-q">¿Puedes echarte atrás?</span>
    <span class="ag-arras-a ag-arras-no">No, echarse atrás se penaliza</span>
    <span class="ag-arras-q">Si una de las partes no cumple</span>
    <span class="ag-arras-out ag-arras-court">pierde la señal como penalización, y la otra parte puede exigir igualmente que se haga la venta</span>
   </div>
  </div>
 </div>
 <figcaption>Los tres tipos de arras del Código Civil. Solo las penitenciales permiten desistir de la venta pagando, y solo si el contrato lo dice expresamente.</figcaption>
</figure>
