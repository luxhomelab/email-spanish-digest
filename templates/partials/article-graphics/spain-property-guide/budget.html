<figure class="ag ag-budget">
 <div class="ag-panel">
  <div class="ag-budget-head">
   <span class="ag-budget-q">A €300,000 flat bought with a mortgage</span>
   <span class="ag-budget-sub">scale: flat price = 100%</span>
  </div>
  <div class="ag-budget-bar" role="img" aria-label="The bank lends 80% of the price, 240,000 euros. The buyer pays 20% of the price, 60,000 euros, plus another 10-15% for taxes and costs, 30,000-45,000 euros. In total you need 30-35% of the price in your own money, 90,000-105,000 euros.">
   <span class="ag-budget-seg ag-c-bank" style="--w:80"></span>
   <span class="ag-budget-seg ag-c-own" style="--w:20"></span>
   <span class="ag-budget-seg ag-c-tax" style="--w:10"></span>
   <span class="ag-budget-seg ag-c-tax ag-budget-maybe" style="--w:5"></span>
  </div>
  <div class="ag-budget-ticks" aria-hidden="true">
   <span style="--x:0">0</span><span style="--x:80">80%</span><span style="--x:100">100%</span><span style="--x:115">115%</span>
  </div>
  <div class="ag-budget-keys">
   <div class="ag-budget-key ag-c-bank"><b>€240,000</b><span>mortgage: up to 80% of the price or valuation</span></div>
   <div class="ag-budget-key ag-c-own"><b>€60,000</b><span>down payment: the other 20%</span></div>
   <div class="ag-budget-key ag-c-tax"><b>€30,000-45,000</b><span>taxes and costs: 10-15% on top, and the bank doesn't lend for them</span></div>
  </div>
  <div class="ag-budget-total">
   <span class="ag-budget-total-num">30-35%</span>
   <span>of the price must be your own money: here that's <b>€90,000-105,000</b></span>
  </div>
 </div>
 <figcaption>The bank pays for only part of the price. You pay everything to the right of the 80% mark yourself. The colours mean the same thing in all the diagrams below: blue is the bank, red is your money, ochre is taxes.</figcaption>
</figure>
