<figure class="ag ag-arras">
 <div class="ag-panel">
  <div class="ag-arras-grid">
   <div class="ag-arras-kind ag-arras-main">
    <span class="ag-arras-name" lang="es">Penitenciales</span>
    <span class="ag-arras-tag">the most common type; needs a direct reference to art. 1454</span>
    <span class="ag-arras-q">Can you pull out?</span>
    <span class="ag-arras-a ag-arras-yes">Yes, either side, at the cost of the deposit</span>
    <span class="ag-arras-q">If the buyer pulls out</span>
    <span class="ag-arras-out"><span class="ag-arras-coins" aria-hidden="true"><i class="ag-arras-lost"></i></span>loses the deposit</span>
    <span class="ag-arras-q">If the seller pulls out</span>
    <span class="ag-arras-out"><span class="ag-arras-coins" aria-hidden="true"><i></i><i></i></span>pays back double the deposit</span>
   </div>
   <div class="ag-arras-kind">
    <span class="ag-arras-name" lang="es">Confirmatorias</span>
    <span class="ag-arras-tag">how courts usually read a contract with no reference to art. 1454</span>
    <span class="ag-arras-q">Can you pull out?</span>
    <span class="ag-arras-a ag-arras-no">No, the deposit is just part of the price</span>
    <span class="ag-arras-q">If one side doesn't go through with it</span>
    <span class="ag-arras-out ag-arras-court">the other side can go to court to enforce the contract or claim damages</span>
   </div>
   <div class="ag-arras-kind">
    <span class="ag-arras-name" lang="es">Penales</span>
    <span class="ag-arras-tag">the deposit works as a penalty</span>
    <span class="ag-arras-q">Can you pull out?</span>
    <span class="ag-arras-a ag-arras-no">No, pulling out is penalised</span>
    <span class="ag-arras-q">If one side doesn't go through with it</span>
    <span class="ag-arras-out ag-arras-court">it loses the deposit as a penalty, and the other side can still demand that the sale goes ahead</span>
   </div>
  </div>
 </div>
 <figcaption>The three types of deposit under the Civil Code. Only penitenciales let you buy your way out of the sale, and only if the contract says so directly.</figcaption>
</figure>
