<figure class="ag ag-deal">
 <div class="ag-panel">
  <ol class="ag-deal-line">
   <li class="ag-deal-row ag-c-own"><span class="ag-deal-when">Day 0</span><span class="ag-deal-event"><span class="ag-deal-title">Reserva</span><span class="ag-deal-sub">€1,000-6,000, the flat comes off the market for a few days. Optional</span></span></li>
   <li class="ag-deal-row ag-c-own"><span class="ag-deal-when">A few days later</span><span class="ag-deal-event"><span class="ag-deal-title">Contrato de arras</span><span class="ag-deal-sub">deposit usually 10% of the price; the contract sets the deed date, usually 1-3 months away</span></span></li>
   <li class="ag-deal-row ag-c-bank"><span class="ag-deal-when">First few weeks</span><span class="ag-deal-event"><span class="ag-deal-title">Tasación and mortgage approval</span><span class="ag-deal-sub">the valuer visits the flat, the bank decides on the loan</span></span></li>
   <li class="ag-deal-row ag-c-bank"><span class="ag-deal-when">At least 10 days before</span><span class="ag-deal-event"><span class="ag-deal-title">FEIN, FiAE and acta de transparencia</span><span class="ag-deal-sub">the bank sends the terms, and you visit a notary for the record, free of charge</span></span></li>
   <li class="ag-deal-row ag-c-ink ag-deal-key"><span class="ag-deal-when">Signing day</span><span class="ag-deal-event"><span class="ag-deal-title">Escritura at the notary</span><span class="ag-deal-sub">you sign the deed and the mortgage, pay and get the keys. The flat is yours</span></span></li>
   <li class="ag-deal-row ag-c-tax"><span class="ag-deal-when">30 working days or a month</span><span class="ag-deal-event"><span class="ag-deal-title">ITP or IVA + AJD</span><span class="ag-deal-sub">the tax goes to the regional tax office; with a mortgage the bank's gestoría usually pays it</span></span></li>
   <li class="ag-deal-row ag-c-ink"><span class="ag-deal-when">A couple of weeks to a couple of months</span><span class="ag-deal-event"><span class="ag-deal-title">Registro de la Propiedad</span><span class="ag-deal-sub">the property is registered in your name</span></span></li>
  </ol>
 </div>
 <figcaption>A mortgage purchase over time. Almost everything the bank does happens between the arras and the deed, so leave plenty of time when you set the deed date in the arras.</figcaption>
</figure>
