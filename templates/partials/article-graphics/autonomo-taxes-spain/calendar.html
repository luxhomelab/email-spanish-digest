<figure class="ag ag-tx">
 <div class="ag-panel">
  <div class="ag-run-head">
   <span class="ag-run-total">The autónomo <b>tax year</b></span>
   <span class="ag-run-sub">What you file and pay, and when</span>
  </div>
  <table class="ag-run-table ag-tx-cal">
   <thead><tr><th scope="col">What</th><th scope="col">When</th></tr></thead>
   <tbody>
    <tr class="ag-tx-ss"><th scope="row"><i></i><b>Social Security quota</b><span>direct debit for the current month</span></th><td>last working day<br>of every month</td></tr>
    <tr class="ag-tx-irpf"><th scope="row"><i></i><b>Form 303 (IVA) and form 130 (IRPF prepayment)</b><span>plus 111 and 115 if you withhold for staff, freelancers or office rent; 349 for EU sales</span></th><td>1–20 April, July, October<br>1–30 January</td></tr>
    <tr class="ag-tx-r24"><th scope="row"><i></i><b>Annual summaries: 390 (IVA), 190 and 180</b><span>190 and 180 only if you filed 111 or 115</span></th><td>by 30 January<br>(190 and 180: by 31 January)</td></tr>
    <tr class="ag-tx-r24"><th scope="row"><i></i><b>Form 347</b><span>anyone you dealt with for over €3,005.06 in the year, unless already reported elsewhere</span></th><td>February</td></tr>
    <tr class="ag-tx-kept"><th scope="row"><i></i><b>The Renta (annual income tax return)</b><span>if you owe, pay 60% now and 40% later</span></th><td>early April – 30 June<br>(second part: early November)</td></tr>
    <tr class="ag-tx-red"><th scope="row"><i></i><b>Social Security regularización</b><span>refund or extra bill for the previous year</span></th><td>after the Renta,<br>usually a year on</td></tr>
   </tbody>
  </table>
 </div>
 <figcaption>To pay forms 303 and 130 by direct debit, file five days earlier (by the 15th; by the 25th in January). A deadline that falls on a weekend or holiday moves to the next working day.</figcaption>
</figure>
