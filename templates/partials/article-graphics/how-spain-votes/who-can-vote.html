<figure class="ag ag-who">
 <div class="ag-panel">
  <table class="ag-who-table">
   <caption class="ag-sr">Which elections each group of residents can vote in.</caption>
   <thead>
    <tr><th scope="col"><span class="ag-sr">Who</span></th><th scope="col">General</th><th scope="col">Regional</th><th scope="col">Municipal</th><th scope="col">European</th></tr>
   </thead>
   <tbody>
    <tr>
     <th scope="row">Spanish citizens<i>aged 18 and over</i></th>
     <td class="ag-who-yes"><small>General</small><span>Yes</span></td><td class="ag-who-yes"><small>Regional</small><span>Yes</span></td><td class="ag-who-yes"><small>Municipal</small><span>Yes</span></td><td class="ag-who-yes"><small>European</small><span>Yes</span></td>
    </tr>
    <tr>
     <th scope="row">EU citizens<i>once on the electoral roll</i></th>
     <td class="ag-who-no"><small>General</small><span>No</span></td><td class="ag-who-no"><small>Regional</small><span>No</span></td><td class="ag-who-yes"><small>Municipal</small><span>Yes</span></td><td class="ag-who-yes"><small>European</small><span>Yes</span></td>
    </tr>
    <tr>
     <th scope="row">Agreement countries<i>e.g. UK, Norway, Colombia, Ecuador, after years of residence</i></th>
     <td class="ag-who-no"><small>General</small><span>No</span></td><td class="ag-who-no"><small>Regional</small><span>No</span></td><td class="ag-who-yes"><small>Municipal</small><span>Yes</span></td><td class="ag-who-no"><small>European</small><span>No</span></td>
    </tr>
   </tbody>
  </table>
 </div>
 <figcaption>For foreign residents, the town hall vote is the one within reach. General and regional elections, including the one on 29 November 2026, are for Spanish citizens only.</figcaption>
</figure>
