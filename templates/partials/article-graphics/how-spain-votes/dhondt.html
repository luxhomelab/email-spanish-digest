<figure class="ag ag-dh">
 <div class="ag-panel ag-dh-panel">
  <div class="ag-dh-head">
   <span class="ag-dh-title">A made-up district: 5 seats, 100,000 valid votes</span>
   <span class="ag-dh-sub">including 1,100 blank votes, so 3% = <b>3,000</b></span>
  </div>
  <span class="ag-dh-unit" aria-hidden="true">Votes in thousands</span>
  <div class="ag-dh-scroll">
   <table class="ag-dh-table">
    <caption class="ag-sr">Each party's votes divided by 1 to 5. The five largest results, numbered 1 to 5 in the order they win, are the five seats.</caption>
    <thead>
     <tr><th scope="col">Party</th><th scope="col" class="ag-dh-votes">Votes</th><th scope="col">÷ 1</th><th scope="col">÷ 2</th><th scope="col">÷ 3</th><th scope="col" class="ag-dh-wide">÷ 4</th><th scope="col" class="ag-dh-wide">÷ 5</th><th scope="col">Seats</th></tr>
    </thead>
    <tbody>
     <tr class="ag-p-a">
      <th scope="row"><em>A</em></th><td class="ag-dh-votes">42,000<i>42%</i></td>
      <td class="ag-dh-win"><span class="ag-dh-n">42,000</span><span class="ag-dh-k" aria-hidden="true">42</span><sup>1</sup></td><td class="ag-dh-win"><span class="ag-dh-n">21,000</span><span class="ag-dh-k" aria-hidden="true">21</span><sup>3</sup></td><td class="ag-dh-near"><span class="ag-dh-n">14,000</span><span class="ag-dh-k" aria-hidden="true">14</span></td><td class="ag-dh-wide">10,500</td><td class="ag-dh-wide">8,400</td>
      <td class="ag-dh-seats"><span><i></i><i></i></span>2</td>
     </tr>
     <tr class="ag-p-b">
      <th scope="row"><em>B</em></th><td class="ag-dh-votes">31,000<i>31%</i></td>
      <td class="ag-dh-win"><span class="ag-dh-n">31,000</span><span class="ag-dh-k" aria-hidden="true">31</span><sup>2</sup></td><td class="ag-dh-win"><span class="ag-dh-n">15,500</span><span class="ag-dh-k" aria-hidden="true">15.5</span><sup>4</sup></td><td><span class="ag-dh-n">10,333</span><span class="ag-dh-k" aria-hidden="true">10.3</span></td><td class="ag-dh-wide">7,750</td><td class="ag-dh-wide">6,200</td>
      <td class="ag-dh-seats"><span><i></i><i></i></span>2</td>
     </tr>
     <tr class="ag-p-c">
      <th scope="row"><em>C</em></th><td class="ag-dh-votes">15,000<i>15%</i></td>
      <td class="ag-dh-win ag-dh-last"><span class="ag-dh-n">15,000</span><span class="ag-dh-k" aria-hidden="true">15</span><sup>5</sup></td><td><span class="ag-dh-n">7,500</span><span class="ag-dh-k" aria-hidden="true">7.5</span></td><td><span class="ag-dh-n">5,000</span><span class="ag-dh-k" aria-hidden="true">5</span></td><td class="ag-dh-wide">3,750</td><td class="ag-dh-wide">3,000</td>
      <td class="ag-dh-seats"><span><i></i></span>1</td>
     </tr>
     <tr class="ag-p-d">
      <th scope="row"><em>D</em></th><td class="ag-dh-votes">8,000<i>8%</i></td>
      <td class="ag-dh-best"><span class="ag-dh-n">8,000</span><span class="ag-dh-k" aria-hidden="true">8</span></td><td><span class="ag-dh-n">4,000</span><span class="ag-dh-k" aria-hidden="true">4</span></td><td><span class="ag-dh-n">2,667</span><span class="ag-dh-k" aria-hidden="true">2.7</span></td><td class="ag-dh-wide">2,000</td><td class="ag-dh-wide">1,600</td>
      <td class="ag-dh-seats ag-dh-zero">0</td>
     </tr>
     <tr class="ag-p-e ag-dh-out">
      <th scope="row"><em>E</em></th><td class="ag-dh-votes"><s>2,900</s><i>2.9%</i></td>
      <td colspan="5" class="ag-dh-outnote ag-dh-desk">2.9% is under 3%, so E is left out before the division</td>
      <td colspan="3" class="ag-dh-outnote ag-dh-mob" aria-hidden="true">2.9%: under 3%, left out</td>
      <td class="ag-dh-seats ag-dh-zero">0</td>
     </tr>
    </tbody>
   </table>
  </div>
  <div class="ag-dh-order">
   <span class="ag-dh-order-label">Seats in the order they're won</span>
   <ol class="ag-dh-chips">
    <li class="ag-p-a"><b>1</b>A 42,000</li>
    <li class="ag-p-b"><b>2</b>B 31,000</li>
    <li class="ag-p-a"><b>3</b>A 21,000</li>
    <li class="ag-p-b"><b>4</b>B 15,500</li>
    <li class="ag-p-c"><b>5</b>C 15,000</li>
   </ol>
   <span class="ag-dh-cut">Next in line: A's 14,000. The fifth seat was decided by <b>1,000 votes</b>, and D's best number, 8,000, never comes close.</span>
  </div>
 </div>
 <figcaption>The d'Hondt method in one table. Filled cells are the five largest results; the small numbers show the order the seats are handed out.</figcaption>
</figure>
