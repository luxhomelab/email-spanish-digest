{# Spanish copy of ../ladder.html (same markup); `d` = load_election_2026("es"). #}
<figure class="ag ag-el-ladder">
 <div class="ag-panel">
  <div class="el-key" aria-hidden="true">
{% for r in d.ratings %}
   <span><i class="el-sw el-r-{{ r.key }}"></i>{{ r.short }}</span>
{% endfor %}
  </div>
  <ol class="el-ladder">
{% for p in d.parties_by_feasibility %}
   <li class="el-rung">
    <span class="el-rung-name"><i class="el-dot" style="--pc: {{ p.color }}"></i>{{ p.name }}</span>
    <span class="el-bar" role="img" aria-label="{{ p.name }}, {{ p.count }} promesas: {% for r, n, pct in p.shares %}{{ n }} {{ d.ratings_by_key[r].short|lower }}{% if not loop.last %}, {% endif %}{% endfor %}">
{% for r, n, pct in p.shares %}{% if n %}<span class="el-seg el-r-{{ r }}" style="width: {{ '%.2f'|format(pct) }}%"></span>{% endif %}{% endfor %}
    </span>
    <span class="el-rung-pct"><b>{{ p.feasible_pct }} %</b> realista</span>
   </li>
{% endfor %}
  </ol>
 </div>
 <figcaption>Parte de las medidas del programa de cada partido según su valoración, {{ d.total_items }} medidas en total, a {{ d.as_of_display }}. Los programas hechos de pequeños pasos prácticos puntúan más alto que los que quieren cambiar el sistema.</figcaption>
</figure>
