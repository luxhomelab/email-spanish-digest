name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: sitemap lastmod comes from git log
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install jinja2 pillow pytest
      - name: JS tests
        run: npm test
      - name: Python tests
        run: python3 -m pytest -q
      - run: python3 build.py --out dist
      - run: npx --yes pagefind --site dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true  # v4+ drops dotfiles by default; keep the v3 artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
