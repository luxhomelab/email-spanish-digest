<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<!-- No GA on redirect pages: the destination URL carries UTM params and
     fires the pageview itself. GA here would log a spurious pageview on
     /x.html and break attribution (self-referral / direct). -->
<meta http-equiv="refresh" content="0; url=https://spanified.com/subscribe?utm_source=x&utm_medium=social&utm_content=link_in_bio">
<link rel="canonical" href="https://spanified.com/subscribe?utm_source=x&utm_medium=social&utm_content=link_in_bio">
<title>Redirecting…</title>
<script>
  window.location.replace("https://spanified.com/subscribe?utm_source=x&utm_medium=social&utm_content=link_in_bio");
</script>
</head>
<body>Redirecting to <a href="https://spanified.com/subscribe?utm_source=x&utm_medium=social&utm_content=link_in_bio">subscribe</a>…</body>
</html>
